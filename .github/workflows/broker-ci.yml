name: Broker CI

on:
  push:
    paths:
      - "broker/**"
      - ".github/workflows/broker-ci.yml"
  pull_request:
    paths:
      - "broker/**"
      - ".github/workflows/broker-ci.yml"

permissions:
  contents: read

jobs:
  broker-test:
    name: Broker Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: broker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check broker
        run: npm run typecheck

      - name: Build broker
        run: npm run build

      - name: Run tests
        run: npm test
