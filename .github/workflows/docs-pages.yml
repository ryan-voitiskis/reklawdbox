name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/domain/**"
      - "src/application/**"
      - "src/adapters/**"
      - "src/mcp/**"
      - "src/cli/**"
      - "src/bootstrap/**"
      - "src/main.rs"
      - "src/README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/mcp-smoke.mjs"
      - "scripts/lib/mcp-stdio.mjs"
      - "scripts/check-doc-contract.mjs"
      - "scripts/check-doc-contract.test.mjs"
      - "scripts/release.sh"
      - "docs/workflows/doc-drift/**"
      - "README.md"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "src/domain/**"
      - "src/application/**"
      - "src/adapters/**"
      - "src/mcp/**"
      - "src/cli/**"
      - "src/bootstrap/**"
      - "src/main.rs"
      - "src/README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/mcp-smoke.mjs"
      - "scripts/lib/mcp-stdio.mjs"
      - "scripts/check-doc-contract.mjs"
      - "scripts/check-doc-contract.test.mjs"
      - "scripts/release.sh"
      - "docs/workflows/doc-drift/**"
      - "README.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Starlight Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Test documentation contract parsers
        run: node --test scripts/check-doc-contract.test.mjs

      - name: Build DB-free runtime
        run: cargo build --release

      - name: Build docs
        working-directory: site
        run: npm run build

      - name: Check live documentation contracts
        run: node scripts/check-doc-contract.mjs --bin ./target/release/reklawdbox --dist ./site/dist

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
